[package]
name = "primordial-soup"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A neural particle simulation in Rust and WGPU"
license = "MIT"
default-run = "primordial-soup"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1.0.104"
bytemuck = { version = "1.25", features = ["derive"] }
base64 = "0.22.1"
eframe = { version = "0.36.2", default-features = false, features = ["wgpu_no_default_features", "default_fonts", "persistence"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
web-time = "1.1"
png = "0.18"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["wgpu", "wayland", "x11"] }
wgpu = { version = "30.0.1", features = ["wgsl"] }
pollster = "0.4"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["std", "wgsl", "webgpu", "fragile-send-sync-non-atomic-wasm"] }
wasm-bindgen = "=0.2.128"
wasm-bindgen-futures = "=0.4.78"
web-sys = { version = "=0.3.105", features = ["Window", "Document", "HtmlCanvasElement", "HtmlVideoElement", "Element", "Location", "Storage", "console", "Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement", "File"] }
js-sys = "=0.3.105"
console_error_panic_hook = "0.1"

[dev-dependencies]
naga = { version = "30.0.1", features = ["wgsl-in"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.web]
inherits = "release"
opt-level = "s"
lto = "fat"

[profile.dev.package."*"]
opt-level = 2

